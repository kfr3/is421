name: Deploy to DigitalOcean (Development)

on:
  push:
    branches:
      - development  # Ensures this runs only when pushing to development

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy files via SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "index.html, about.html, images/*"  # Ensure this file exists in your repo
          target: "/var/www/dev.startupproject.me/"

      - name: Restart Nginx
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo systemctl restart nginx

